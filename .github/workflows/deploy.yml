name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # main へのプルリクエストでも検証だけ走らせる（デプロイはしない）
  pull_request:
    branches: [main]
  # push イベントが取りこぼされたときに手動でデプロイし直せるようにする
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ffmpeg のコマンド組み立ての同一性やプールの判定ロジックを検証する
      - run: npm test
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: build

  deploy:
    # 検証が通った push のときだけデプロイする
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
